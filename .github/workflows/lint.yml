name: Lint

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  rosenpass-tests:
    name: Rosenpass regression tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Exercise the guard and status parser
        run: |
          docker run --rm --network none \
            -v "$GITHUB_WORKSPACE:/work:ro" \
            -v "$GITHUB_WORKSPACE/src/usr/local/emhttp/plugins/netbird:/usr/local/emhttp/plugins/netbird:ro" \
            -w /work php:8.2-cli php tests/rosenpass-test.php

  php-cs-fixer:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP-CS-Fixer (dry run)
        uses: docker://oskarstark/php-cs-fixer-ga
        with:
          args: --config=.php-cs-fixer.dist.php --diff --dry-run

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHPStan
        uses: docker://ghcr.io/phpstan/phpstan
        with:
          args: analyse -c phpstan.dist.neon --no-progress
